name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Vite build and PHPUnit (PHP 8.3, SQLite in memory)
    runs-on: ubuntu-latest
    # The same settings as a local test run (README › Tests). No .env is needed.
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, openssl, gd, intl, zip, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Also what the pages under test load: without public/build/manifest.json they fail.
      - name: Build the assets
        run: |
          npm ci
          npx vite build

      - name: An app key for this run
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Run the tests
        run: vendor/bin/phpunit
